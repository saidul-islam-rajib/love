name: Deploy to AWS App Runner

on:
  push:
    branches: [visitor-working]
  workflow_dispatch: {}

permissions:
  id-token: write # required for OIDC -> AWS
  contents: read

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: love-proposal
  APPRUNNER_SERVICE_ARN: arn:aws:apprunner:ap-southeast-1:468509502416:service/love-proposal

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::468509502416:role/love-github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

      - name: Trigger App Runner deployment
        run: |
          aws apprunner start-deployment --service-arn "$APPRUNNER_SERVICE_ARN"

      - name: Wait for deployment to finish
        run: |
          for i in $(seq 1 40); do
            STATUS=$(aws apprunner describe-service --service-arn "$APPRUNNER_SERVICE_ARN" --query 'Service.Status' --output text)
            echo "App Runner status: $STATUS"
            if [ "$STATUS" = "RUNNING" ]; then
              echo "Deployment successful."
              exit 0
            fi
            if [ "$STATUS" = "CREATE_FAILED" ] || [ "$STATUS" = "DELETE_FAILED" ]; then
              echo "Deployment failed with status $STATUS"
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for deployment to reach RUNNING"
          exit 1
